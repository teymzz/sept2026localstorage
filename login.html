<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Welcome Back!</h1>
        <p>Log in to your account.</p>

        <form id="loginForm">

            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="Enter your email">

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">

            <p id="loginMessage"></p>

            <button type="submit" onclick="login(event)">Log In</button>

        </form>

        <p>
            Don't have an account?
            <a href="index.html">Sign Up</a>
        </p>

    </div>

</body>
<script>
        let users = JSON.parse(localStorage.getItem('user')) || []

        console.log(users);
        
        
        function login(event) {
            event.preventDefault()

            let inputEmail = document.getElementById('loginEmail')
            let inputPass = document.getElementById('loginPassword')

            let userMail = inputEmail.value.trim().toLowerCase();
            let userPass = inputPass.value.trim();

            let userFound = users.find(value => {
               return  (value.email === userMail) && (value.password === userPass)
            })

            if(userFound){
               window.location.href = 'dashboard.html'
            }else{
                console.log('user does not exist.');
            }
            

            // if(userFound){
            //     localStorage.setItem('user', )
            // }


        }
</script>
</html>
