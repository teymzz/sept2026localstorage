<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Create Your Account</h1>
      <p>Join us and get started today.</p>

      <form id="signupForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" />

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" />

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
        />

        <p id="message"></p>

        <button type="button" onclick="signup()">Sign Up</button>
      </form>

      <p>
        Already have an account?
        <a href="login.html">Log In</a>
      </p>
    </div>
  </body>

  <script>

    // let users = [];

    let users = JSON.parse(localStorage.getItem('user')) || []

    console.log(users);
    

    function signup() {
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirmPassword").value;

      let message = document.getElementById("message");

      if (
        name === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
      ) {
        message.innerHTML = "Please fill in all fields";
      } else if (password !== confirmPassword) {
        message.innerHTML = "Passwords do not match";
      } else {
        let answer = users.find(function (user) {
          return user.email === email;
        });

        if (answer) {
          message.innerHTML = "Email already exists";
        } else {
          let newUser = {
            name: name,
            email: email,
            password: password,
            isLoggedIn: false
          };

          users.push(newUser);

          let stringOfUsers = JSON.stringify(users)

          localStorage.setItem('user', stringOfUsers)

          message.innerHTML = "Signup successful!";

          console.log(users);

        }
      }
    }
    
  </script>
</html>
